#####################################################
#                                                   #
#  ****** BOTTOM/LEFT: south and west sides ******  #
#                                                   #
#####################################################

- name: config_tc_pad
  description: "Config and internal signals instantiation"
  pad_type: CONFIG_TC_PAD_DEF
  is_static: true

- name: corner_{i}
  multiple: 4
  description: "Corner pad"
  pad_type: PAD_CORNER
  is_static: true


########################
#                      #
#  ****** WEST ******  #
#                      #
########################

########################################
# POWER MANAGEMENT PADS - West
########################################

- name: pwr_mng_west
  description: "West power management horizontal pad cell"
  pad_type: PAD_PWR_MNG_H
  is_static: true

########################################
# I/O POWER - West
########################################

- name: vdd_io_{i}_h
  multiple: 2
  description: "I/O power domain horizontal VDD pad"
  pad_type: PAD_VDD_IO_H
  is_static: true

- name: vss_io_{i}_h
  multiple: 2
  description: "I/O power domain horizontal VSS pad"
  pad_type: PAD_VSS_IO_H
  is_static: true

########################################
# CORE POWER - West
########################################

- name: vdd_core_{i}_h
  multiple: 3
  description: "Core power domain horizontal VDD pad"
  pad_type: PAD_VDD_CORE_H
  is_static: true

- name: vss_core_{i}_h
  multiple: 2
  description: "Core power domain horizontal VSS pad"
  pad_type: PAD_VSS_CORE_H
  is_static: true

########################################
# SIGNALS - West
########################################

- name: fll_host
  description: "FLL host clock"
  pad_type: PAD_OUTPUT_H
  is_static: true
  connections:
    chip2pad: fll_host_clk_o
    output_en: 1'b1
    drive_strength: drive_strength_grp_1
    slew_en: slew_en_grp_1

- name: fll_secd
  description: "FLL secd clock"
  pad_type: PAD_OUTPUT_H
  is_static: true
  connections:
    chip2pad: fll_secd_clk_o
    output_en: 1'b1
    drive_strength: drive_strength_grp_1
    slew_en: slew_en_grp_1

- name: fll_bypass
  description: "FLL bypass"
  pad_type: PAD_INPUT_H
  is_static: true
  connections:
    pad2chip: fll_bypass_i
    input_en: 1'b1

- name: pwr_on_rst_n
  description: "Power on reset, active-low"
  pad_type: PAD_INPUT_H
  is_static: true
  connections:
    pad2chip: pwr_on_rst_ni
    input_en: 1'b1

- name: boot_mode_{i}
  multiple: 2
  description: "Boot mode"
  pad_type: PAD_INPUT_H
  is_static: true
  connections:
    pad2chip: boot_mode_i_{i}
    input_en: 1'b1

- name: secure_boot
  description: "Secure boot"
  pad_type: PAD_INPUT_H
  is_static: true
  connections:
    pad2chip: secure_boot_i
    input_en: 1'b1

- name: ref_clk
  description: "Reference clock"
  pad_type: PAD_INPUT_H
  is_static: true
  connections:
    pad2chip: ref_clk_i
    input_en: 1'b1

- name: jtag_tclk
  description: "JTAG tclk"
  pad_type: PAD_INPUT_H
  is_static: true
  connections:
    pad2chip: jtag_tclk_i
    input_en: 1'b1
    
- name: jtag_trst_n
  description: "JTAG trst, active-low"
  pad_type: PAD_INPUT_H
  is_static: true
  connections:
    pad2chip: jtag_trst_ni
    input_en: 1'b1

- name: jtag_tms
  description: "JTAG tms"
  pad_type: PAD_INPUT_H
  is_static: true
  connections:
    pad2chip: jtag_tms_i
    input_en: 1'b1
    
- name: jtag_tdi
  description: "JTAG tdi"
  pad_type: PAD_INPUT_H
  is_static: true
  connections:
    pad2chip: jtag_tdi_i
    input_en: 1'b1

- name: jtag_tdo
  description: "JTAG tdo"
  pad_type: PAD_OUTPUT_H
  is_static: true
  connections:
    chip2pad: jtag_tdo_o
    output_en: 1'b1
    drive_strength: drive_strength_grp_2
    slew_en: slew_en_grp_2

- name: uart_tx
  description: "UART tx"
  pad_type: PAD_OUTPUT_H
  is_static: true
  connections:
    chip2pad: uart_tx_o
    output_en: 1'b1
    drive_strength: drive_strength_grp_3
    slew_en: slew_en_grp_3

- name: uart_rx
  description: "UART rx"
  pad_type: PAD_INPUT_H
  is_static: true
  connections:
    pad2chip: uart_rx_i
    input_en: 1'b1

- name: gpio_{i}
  multiple: 4
  description: "gpio in/out"
  pad_type: PAD_BIDIR_H
  is_static: true
  connections:
    chip2pad: gpio_v_o_{i}
    pad2chip: gpio_v_i_{i}
    input_en: ~gpio_v_oen_i_{i}
    output_en: gpio_v_oen_i_{i}
    drive_strength: drive_strength_grp_{i+4}
    slew_en: slew_en_grp_{i+4}


